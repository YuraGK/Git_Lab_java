zuul:
  routes:
    workload-service:
      path: /workload/**
      service-id: WORKLOAD-SERVICE
    gym-service:
      path: /gym/**
      service-id: GYM-SERVICE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost

server:
  port: 8085


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
  main:
    web-application-type: reactive

WORKLOAD-SERVICE:
  ribbon:
    ReadTimeout: 300000
GYM-SERVICE:
  ribbon:
    ReadTimeout: 300000