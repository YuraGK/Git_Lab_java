spring:
  active:
    profiles: dev
  jpa:
    database: postgresql
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: newuser
    password: password
    driver-class-name: org.postgresql.Driver
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  activemq:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
    packages:
      trusted: com.warehouse.tmp.module
  pool:
    block-it-full: true
    block-it-full-timeout: -1
    create-connection-on-startup: true
    enabled: false
    expiry-timeout: 0
    idle-timeout: 30000
    reconnect-on-exception: true
    in-memory: false
  jms:
    listener:
      acknowledge-mode: auto
      auto-startup: true
      concurrency: 5
      max-concurrency: 10
    pub-sub-domain: false



